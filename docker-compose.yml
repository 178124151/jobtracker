services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - jobtracker
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-vWzL2WyHCu8Y9x75ai3uQrBU68zp6F8k}
      - DB_NAME=jobtracker
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:-6dqsMrDndjABEv4V9eHTYrkNrCq3j9zKbCsfQXbuGU4w46Wj}
      - SERVER_PORT=8080
    volumes:
      - ./data:/root/data
    depends_on:
      - postgres
      - redis
    networks:
      - jobtracker
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      # 只绑定本机，避免把数据库暴露到公网
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=jobtracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vWzL2WyHCu8Y9x75ai3uQrBU68zp6F8k}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jobtracker
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 21600 1
    volumes:
      - redis:/data
    networks:
      - jobtracker
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - jobtracker
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus:/prometheus
    networks:
      - jobtracker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-UrFt3ctHWstLjyBtUcEAss8A}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - jobtracker
    restart: unless-stopped

networks:
  jobtracker:
    driver: bridge

volumes:
  pgdata:
  redis:
  prometheus:
  grafana:
