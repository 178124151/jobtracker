apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobtracker-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - jobtracker.example.com
    secretName: jobtracker-tls
  rules:
  - host: jobtracker.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jobtracker-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jobtracker-backend
            port:
              number: 8080
