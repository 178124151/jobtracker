apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker-frontend
  labels:
    app: jobtracker
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobtracker
      component: frontend
  template:
    metadata:
      labels:
        app: jobtracker
        component: frontend
    spec:
      containers:
        - name: frontend
          image: jobtracker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: jobtracker
    component: frontend
spec:
  selector:
    app: jobtracker
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: ClusterIP