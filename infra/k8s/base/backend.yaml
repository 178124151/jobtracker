apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker-backend
  labels:
    app: jobtracker
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobtracker
      component: backend
  template:
    metadata:
      labels:
        app: jobtracker
        component: backend
    spec:
      containers:
        - name: backend
          image: jobtracker-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "vWzL2WyHCu8Y9x75ai3uQrBU68zp6F8k"
            - name: DB_NAME
              value: "jobtracker"
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: JWT_SECRET
              value: "6dqsMrDndjABEv4V9eHTYrkNrCq3j9zKbCsfQXbuGU4w46Wj"
            - name: SERVER_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: sme-data
              mountPath: /root/data
              readOnly: true
      volumes:
        - name: sme-data
          configMap:
            name: sme-data
            optional: true
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: jobtracker
    component: backend
spec:
  selector:
    app: jobtracker
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
  type: NodePort
