apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker-backend
  labels:
    app: jobtracker
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobtracker
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jobtracker
        component: backend
    spec:
      containers:
        - name: backend
          image: jobtracker-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: db-host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: db-password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: jobtracker-config
                  key: db-name
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobtracker-secrets
                  key: jwt-secret
            - name: SERVER_PORT
              value: "8080"
          # D5: 健康检查探针
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # 资源限制
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: jobtracker
    component: backend
spec:
  selector:
    app: jobtracker
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP