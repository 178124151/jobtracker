apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: jobtracker
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobtracker
      component: prometheus
  template:
    metadata:
      labels:
        app: jobtracker
        component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: Never
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: jobtracker
    component: prometheus
spec:
  selector:
    app: jobtracker
    component: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
