apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: jobtracker
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobtracker
      component: database
  template:
    metadata:
      labels:
        app: jobtracker
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jobtracker
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: vWzL2WyHCu8Y9x75ai3uQrBU68zp6F8k
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: jobtracker
    component: database
spec:
  selector:
    app: jobtracker
    component: database
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
