apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: jobtracker
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobtracker
      component: cache
  template:
    metadata:
      labels:
        app: jobtracker
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--save", "21600", "1"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: jobtracker
    component: cache
spec:
  selector:
    app: jobtracker
    component: cache
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None