apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: jobtracker
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobtracker
      component: monitoring
  template:
    metadata:
      labels:
        app: jobtracker
        component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  labels:
    app: jobtracker
    component: monitoring
spec:
  type: NodePort
  selector:
    app: jobtracker
    component: monitoring
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300