global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - 服务器指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'jobtracker-server'

  # JobTracker后端 - 应用指标
  - job_name: 'jobtracker-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/api/v1/sre/prometheus'
    scrape_interval: 30s

rule_files:
  - 'alert-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []